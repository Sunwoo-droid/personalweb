<script>
/* ================================================================
   home gateway — one screen, no scroll. the field comes from the
   shared engine in site.js; this script drops the dive-in on a
   random column of the RIGHT half (so it can never land on the
   name or the link stack) and scrambles it in once on load.
   ================================================================ */
(function(){
  "use strict";
  var KR = window.KR || {};
  var reduce = (KR.reduce != null) ? KR.reduce
             : (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  var field = document.getElementById("field");
  var dive  = document.getElementById("divein");
  if(!field || !KR.buildField) return;

  var G = KR.fieldGeom;
  var H = field.clientHeight || window.innerHeight || 800;
  var narrow = window.innerWidth < 768;

  /* pick the slot: right half on desktop (columns from the midpoint up),
     bottom band on narrow screens where the copy owns the full width. */
  var first = narrow ? 0 : Math.ceil(G.cols/2);
  var span  = Math.max(1, G.cols - first);
  var dc    = first + Math.floor(Math.random()*span);
  var lo    = narrow ? 0.80 : 0.14;
  var hi    = narrow ? 0.93 : 0.86;
  var diveY = (lo + Math.random()*(hi-lo)) * H;

  if(dive){
    dive.style.left = (dc*G.colw + G.pad).toFixed(0) + "px";
    dive.style.top  = diveY.toFixed(0) + "px";
  }

  /* that slot is reserved, so no background fragment can spawn on it */
  KR.buildField(field, 0.85, { c: dc, y: diveY });

  /* learn-more: held blank and invisible for a beat (the chip fades in on
     a 1s CSS delay), then scrambles itself out on the same clock */
  if(dive){
    if(reduce || !KR.krType){
      dive.textContent = "learn more";
    } else {
      dive.textContent = "";
      setTimeout(function(){ KR.krType(dive, "learn more", 62, 220); }, 1000);
    }
  }
})();
</script>
